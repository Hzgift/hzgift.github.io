<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <title>Мои Майнкрафт Анимации</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Шапка -->

        <h1>ТВОЕ ИМЯ/НИКНЕЙМ</h1>

    </header>

    <!-- Секция с рендерами -->
    <section class="gallery">
        <h2>Мои Рендеры</h2>
        <div class="grid">
            <!-- Вставь свои картинки -->
            <img src="https://via.placeholder.com/400x300?text=Рендер+1" alt="Рендер 1">
            <img src="https://via.placeholder.com/400x300?text=Рендер+2" alt="Рендер 2">

        <h2>Мои Анимации</h2>
        <!-- Вставь ссылки на свои видео с YouTube (или вставь код iframe) -->
        <div class="video-container">
            <iframe width="560" height="315" src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            <iframe width="560" height="315" src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </section>

    <!-- Контакты -->
    <footer>
        <p>Связь со мной: <a href="https://vk.com/твой_вк">ВКонтакте</a> | <a href="https://t.me/твой_тг">Telegram</a></p>
    </footer>
