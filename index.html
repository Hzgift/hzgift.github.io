<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hzgift_xD | 3D Animator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="hero">
        <div class="status">
            <span class="dot"></span> Открыт для заказов
        </div>

        <h1 class="main-title">Hzgift_xD</h1>
        <h2 class="sub-title">3D ANIMATOR</h2>

        <p class="description">Маленький школьник сделает для тебя анимацию или рендер качественно и быстро! :]</p>

        <div class="buttons">
            <a href="#portfolio" class="btn-primary">ПОРТФОЛИО</a>
            <a href="#price" class="btn-secondary">ПРАЙС</a>
        </div>
    </div>

    <!-- Секция портфолио -->
    <section id="portfolio" class="portfolio-section">
        <h2 class="section-title">Мои работы</h2>
        
        <!-- ВЕРТИКАЛЬНЫЕ ВИДЕО (Тиктоки) -->
        <div class="video-grid video-grid-portrait">
            <div class="video-card">
                <video src="video1.mp4" controls preload="metadata"></video>
            </div>
            <div class="video-card">
                <video src="video2.mp4" controls preload="metadata"></video>
            </div>
        </div>

        <!-- ГОРИЗОНТАЛЬНЫЕ ВИДЕО (Длинные) -->
        <div class="video-grid video-grid-landscape">
            <div class="video-card">
                <video src="video3.mp4" controls preload="metadata"></video>
            </div>
            <div class="video-card">
                <video src="video4.mp4" controls preload="metadata"></video>
            </div>
            <div class="video-card">
                <video src="video5.mp4" controls preload="metadata"></video>
            </div>
        </div>

        <!-- Общие надписи внизу -->
        <div class="highlight-badges">
            <div class="big-badge">Работал с Cristalix</div>
            <div class="big-badge">Работал с ютуберами с 1млн+ подписчиков</div>
        </div>
    </section>

    <!-- Партиклы (создаются скриптом) -->
    <div class="particles-container" id="particles"></div>

    <script>
        // Генерация плавных полупрозрачных шариков
        const container = document.getElementById('particles');
        const count = 40; // Количество шариков

        for (let i = 0; i < count; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            
            // Случайный размер от 2 до 8 пикселей
            const size = Math.random() * 6 + 2;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            
            // Случайная позиция
            particle.style.left = `${Math.random() * 100}vw`;
            particle.style.top = `${Math.random() * 100}vh`;
            
            // Случайная скорость плавания (от 10 до 30 секунд)
            particle.style.animationDuration = `${Math.random() * 20 + 10}s`;
            particle.style.animationDelay = `${Math.random() * 10}s`;
            
            container.appendChild(particle);
        }
    </script>

</body>
</html>
